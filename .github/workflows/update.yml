name: Update election CSVs

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's minimum; on busy nights it can run late)
  workflow_dispatch:         # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-csv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CSVs from civicAPI
        run: python scripts/build_csv.py

      - name: Commit if anything changed
        run: |
          git config user.name "election-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Results update $(date -u +'%H:%M UTC')"
            git push
          fi
